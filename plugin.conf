NAME=unraid-tmux
TITLE=tmux
UPSTREAM=mjakob-gh/build-static-tmux
BINARY=tmux
ASSET='tmux.linux-amd64.stripped.gz'
VERSION_ARGS=-V
TEST_CMD='test -s /usr/share/terminfo/t/tmux-256color && /usr/local/bin/tmux -f /dev/null new-session -d -s test "sleep 3" && /usr/local/bin/tmux has-session -t test && /usr/local/bin/tmux kill-server'
